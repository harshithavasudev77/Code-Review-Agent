[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "code-review-agent"
version = "0.1.0"
description = "Project 3E: LangGraph multi-agent code review with Nebius and Streamlit"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
  "langgraph>=1.0,<2",
  "langchain-core>=1.2.22,<2",
  "openai>=2,<4",
  "pydantic>=2.10,<3",
  "python-dotenv>=1.0,<2",
  "streamlit>=1.54,<2",
  "striprtf>=0.0.29,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
code-review = "code_review.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
